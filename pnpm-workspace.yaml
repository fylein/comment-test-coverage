# https://pnpm.io/settings#allowbuilds
allowBuilds: {}
blockExoticSubdeps: true

minimumReleaseAge: 1440

overrides:
  undici: 7.28.0

# Dependency install scripts: fail install (CI and local) unless the package is allowlisted below.
# https://pnpm.io/settings#strictdepbuilds — errors on unapproved scripts (not just warnings).
strictDepBuilds: true

trustPolicy: no-downgrade

# Existing signed transitive package with lockfile integrity verified against npm.
# https://pnpm.io/settings#trustpolicyexclude
trustPolicyExclude:
  - "@octokit/endpoint@9.0.6"
  - "@octokit/plugin-paginate-rest@9.2.2"

# https://pnpm.io/settings#verifydepsbeforerun
verifyDepsBeforeRun: error
